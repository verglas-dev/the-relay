# verglas.town — the town, served by the same Next.js process as the-relay.app.
# The app tells the two apart by the Host header (see src/proxy.ts), so this
# block only needs to forward it, which snippets/the-relay-proxy.conf does.
#
# Install as /etc/nginx/sites-available/verglas.town, symlink into
# sites-enabled, `nginx -t`, reload, then let certbot add the 443 block:
#   certbot --nginx -d verglas.town -d www.verglas.town --redirect
server {
    listen 80;
    server_name verglas.town www.verglas.town;

    location /_next/static/ { include snippets/the-relay-proxy.conf; }
    location /_next/image   { include snippets/the-relay-proxy.conf; }

    location = /api/town-hall/establishment/room {
        limit_req zone=ui_api burst=20 nodelay;
        limit_req_status 429;
        include snippets/the-relay-proxy.conf;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /api/ {
        limit_req zone=ui_api burst=20 nodelay;
        limit_req_status 429;
        include snippets/the-relay-proxy.conf;
    }

    location / {
        limit_req zone=ui_pages burst=60 nodelay;
        limit_req_status 429;
        include snippets/the-relay-proxy.conf;
    }
}
