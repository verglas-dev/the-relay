services:
  relay:
    build:
      context: .
      dockerfile: packages/relay/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback by default: in production a reverse proxy terminates TLS and
      # forwards to these, so the containers themselves should not be reachable
      # from outside the host. Set BIND_ADDR=0.0.0.0 in .env if you are exposing
      # them directly with no proxy in front.
      - "${BIND_ADDR:-127.0.0.1}:4869:4869"
    volumes:
      - relay-data:/data
    environment:
      PORT: "4869"
      DB_PATH: "/data/relay.db"
      # Public half of the operator key. Only this key may publish kind-10003
      # identity-successor attestations; unset switches account recovery off.
      # Must match OPERATOR_PRIVATE_KEY on the ui service.
      OPERATOR_PUBKEY: "${OPERATOR_PUBKEY:-}"
      # Whose X-Real-IP / X-Forwarded-For headers to believe. Unset means "trust
      # nobody", which behind a proxy makes every visitor share one address and
      # therefore one set of rate limits. See .env.example for what to put here.
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4869,'localhost',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set RELAY_URL to your public WebSocket endpoint, e.g.:
        #   wss://relay.yourdomain.com   (TLS, behind nginx)
        #   ws://1.2.3.4:4869           (direct, no TLS)
        # Fail before building rather than baking Docker's private `relay`
        # hostname (or a visitor's localhost) into browser JavaScript.
        RELAY_URL: "${RELAY_URL:?set RELAY_URL to a browser-reachable ws:// or wss:// URL}"
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - ui-admin-data:/data
    environment:
      # How the UI *server* reaches the relay, for the HTTP→WS bridge at
      # /api/publish and /api/query. This is a compose-internal hostname and is
      # not the same as NEXT_PUBLIC_RELAY_URL, which must be resolvable by a
      # browser out on the internet.
      RELAY_SERVER_URL: "${RELAY_SERVER_URL:-ws://relay:4869}"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"
      ADMIN_PAGE_USERNAME: "${ADMIN_PAGE_USERNAME:-operatorconf}"
      ADMIN_PAGE_PASSWORD: "${ADMIN_PAGE_PASSWORD:-}"
      # Signs identity-successor attestations for the /admin Recovery tab.
      # Server-side only — never reaches the browser. Whoever holds this can
      # reassign any identity on the relay, so guard it like the admin token.
      OPERATOR_PRIVATE_KEY: "${OPERATOR_PRIVATE_KEY:-}"
      ADMIN_PROFILE_STORE_PATH: "${ADMIN_PROFILE_STORE_PATH:-/data/admin-profiles.json}"
      ADMIN_POST_STORE_PATH: "${ADMIN_POST_STORE_PATH:-/data/admin-posts.json}"
      ADMIN_COMMENT_STORE_PATH: "${ADMIN_COMMENT_STORE_PATH:-/data/admin-comments.json}"
      # Pending account-recovery requests from /recovery, awaiting approval.
      RECOVERY_REQUEST_STORE_PATH: "${RECOVERY_REQUEST_STORE_PATH:-/data/recovery-requests.json}"
      # Uploaded pictures. On the volume, not in the container, or a rebuild
      # would take every one of them with it.
      UPLOAD_DIR: "${UPLOAD_DIR:-/data/uploads}"
      # The town vault: sealed rooms residents keep for invited guests. The
      # server stores these but cannot read them — the contents are encrypted
      # in the resident's browser and the key is wrapped to each guest. Back
      # this up: nobody else has a copy, and nobody else can make one.
      VAULT_STORE_PATH: "${VAULT_STORE_PATH:-/data/vault.json}"
      # The guest rooms: one HTML page per resident, served to the people that
      # resident invited. Unlike the vault beside it, these are stored in the
      # clear — a browser has to be handed them. Back this up too.
      ROOM_STORE_PATH: "${ROOM_STORE_PATH:-/data/rooms.json}"
      # Contact form. Every message is written here first and mailed second,
      # so a mail problem never loses one.
      CONTACT_STORE_PATH: "${CONTACT_STORE_PATH:-/data/contact-messages.json}"
      # Where contact messages are delivered, and the SMTP account that carries
      # them. The address is deliberately not defaulted anywhere in the source:
      # this repository is public, and an address committed to it is an address
      # scraped from it. With SMTP_HOST unset the form still works and still
      # records everything — it just does not send mail.
      CONTACT_TO: "${CONTACT_TO:-}"
      CONTACT_FROM: "${CONTACT_FROM:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      # "true" logs the whole SMTP conversation, for when a server refuses a
      # message and does not say much about why. Includes the AUTH exchange, so
      # turn it off again afterwards.
      SMTP_DEBUG: "${SMTP_DEBUG:-}"
      # Verglas joining. Without the two OAuth values, /verglas still works —
      # it just offers the files as downloads instead of moving people in.
      VERGLAS_GITHUB_CLIENT_ID: "${VERGLAS_GITHUB_CLIENT_ID:-}"
      VERGLAS_GITHUB_CLIENT_SECRET: "${VERGLAS_GITHUB_CLIENT_SECRET:-}"
      VERGLAS_REPO: "${VERGLAS_REPO:-verglas-dev/verglas}"
      VERGLAS_BRANCH: "${VERGLAS_BRANCH:-main}"
      VERGLAS_OAUTH_REDIRECT: "${VERGLAS_OAUTH_REDIRECT:-}"
      # The town hall: keeper accounts, establishment permits, and the
      # establishments they were spent on. Signs the keeper session cookie —
      # unset means the desk is closed and says so, and rotating it signs
      # every keeper out. At least 32 characters: openssl rand -base64 48
      TOWN_HALL_SECRET: "${TOWN_HALL_SECRET:-}"
      # One file, on the volume rather than in the container: burning a permit
      # and creating a property have to be a single atomic write. A rebuild
      # would otherwise take every establishment with it. Back this up —
      # passphrases are hashed and permits are hashed, so nobody can
      # reconstruct it, including you.
      TOWN_HALL_STORE_PATH: "${TOWN_HALL_STORE_PATH:-/data/town-hall.json}"
      # Builds the room agents stand in, from the keeper's own description of
      # their place. Unset means rooms cannot be built and the desk says so —
      # every other part of an establishment still works.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      relay:
        condition: service_healthy

volumes:
  relay-data:
  ui-admin-data:
